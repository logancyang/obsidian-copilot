# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    # Run on all pull requests regardless of target branch

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Obsidian community review gate
        run: npm run review:obsidian
      - run: npm run lint
      # Type-checks the project and bundles the plugin. Otherwise both run only
      # when a release PR merges, so a break would sit on master until someone
      # cut a release.
      - run: npm run build
      # Builds the component gallery's whole story graph, so a story that cannot
      # bundle fails the PR instead of reaching master unnoticed.
      - run: npm run gallery:build
      - run: npm run test:mobile-load
      - run: npm test

  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Test native PowerShell publishing wrapper
        run: npm test -- --runInBand src/agentMode/skills/builtin/openArtifactsPublishWrappers.test.ts

  # Native coverage is required to diagnose Windows-only fixture failures.
  # https://github.com/logancyang/obsidian-copilot/issues/2967
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Record native test environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-test-results
          git rev-parse HEAD > windows-test-results/environment.txt
          [System.Environment]::OSVersion.VersionString >> windows-test-results/environment.txt
          node --version >> windows-test-results/environment.txt
          npm.cmd --version >> windows-test-results/environment.txt
          node -p "process.platform + ' ' + process.arch" >> windows-test-results/environment.txt
      - run: npm ci
      - name: Run complete native Windows unit suite
        shell: pwsh
        run: |
          npm.cmd test -- --runInBand --json --outputFile=windows-test-results/jest.json *> windows-test-results/jest.log
          $testExitCode = $LASTEXITCODE
          Get-Content windows-test-results/jest.log
          exit $testExitCode
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-node-22
          path: windows-test-results/
          retention-days: 14

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
